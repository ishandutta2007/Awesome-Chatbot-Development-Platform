<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.15); opacity: 0.8; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-15px) translateX(10px); opacity: 0.7; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes pulseNode {
        0%, 100% { r: 6px; fill: #58a6ff; }
        50% { r: 9px; fill: #bc8cff; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      .bg-glow { transform-origin: center; animation: pulseGlow 6s ease-in-out infinite; }
      .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
      .particle-3 { animation: floatParticle 6s ease-in-out infinite 2s; }
      .node-pulse { animation: pulseNode 3s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 8 8; animation: dashMove 2s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <circle cx="600" cy="180" r="300" fill="url(#glow)" class="bg-glow"/>

  <!-- Background Dynamic Network Nodes & Flow Lines (Behind text layer) -->
  <g opacity="0.25">
    <path d="M 100 180 Q 300 80 600 180 T 1100 180" fill="none" stroke="#58a6ff" stroke-width="2" class="flow-line"/>
    <path d="M 150 280 Q 400 100 700 240 T 1050 100" fill="none" stroke="#bc8cff" stroke-width="1.5" class="flow-line"/>
    
    <!-- Nodes -->
    <circle cx="100" cy="180" r="6" fill="#58a6ff" class="node-pulse"/>
    <circle cx="300" cy="130" r="5" fill="#3fb950" class="particle-1"/>
    <circle cx="500" cy="230" r="6" fill="#bc8cff" class="particle-2"/>
    <circle cx="700" cy="130" r="5" fill="#58a6ff" class="particle-3"/>
    <circle cx="900" cy="220" r="6" fill="#3fb950" class="node-pulse"/>
    <circle cx="1100" cy="180" r="6" fill="#bc8cff"/>
  </g>

  <!-- Ambient Particles -->
  <g fill="#58a6ff">
    <circle cx="200" cy="80" r="2.5" class="particle-1"/>
    <circle cx="1020" cy="280" r="3" class="particle-2"/>
    <circle cx="150" cy="300" r="2" class="particle-3"/>
    <circle cx="980" cy="70" r="3.5" class="particle-1"/>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g filter="url(#shadow)" text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="145" font-size="46" font-weight="800" letter-spacing="1" fill="url(#titleGrad)">
      🤖 Awesome Chatbot Development Platform
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" font-size="20" font-weight="500" fill="#c9d1d9" letter-spacing="0.5">
      The Ultimate Curated Hub for SaaS Platforms, AI Agent Builders &amp; Open-Source Frameworks
    </text>

    <!-- Category Pills / Badges in Foreground -->
    <g transform="translate(600, 245)">
      <!-- Pill 1 -->
      <g transform="translate(-360, 0)">
        <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
        <text x="0" y="5" font-size="14" font-weight="600" fill="#58a6ff" text-anchor="middle">⚡ Conversational AI</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-120, 0)">
        <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
        <text x="0" y="5" font-size="14" font-weight="600" fill="#bc8cff" text-anchor="middle">🔮 Visual Builders</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(120, 0)">
        <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
        <text x="0" y="5" font-size="14" font-weight="600" fill="#3fb950" text-anchor="middle">🚀 Open-Source Engines</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(360, 0)">
        <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
        <text x="0" y="5" font-size="14" font-weight="600" fill="#d29922" text-anchor="middle">🌐 Multi-Channel AI</text>
      </g>
    </g>
  </g>
</svg>
